# Runs the Playwright tests on pushes to main and on pull requests.
# The tests are split into 4 shards that run at the same time.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      # Let every shard finish, so one run shows all failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Tests use the installed Chrome. Install it only if it is missing.
      - run: google-chrome --version || npx playwright install --with-deps chrome
      # Two workers: each generator gets more of the slow CI machine.
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          WORKERS: 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
